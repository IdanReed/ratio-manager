[package]
name = "ratio-sim"
version = "0.1.0"
edition = "2021"
description = "An event-driven simulator of TorrentLeech, the boxes and the swarms, for training and testing ratio-manager policies offline"
license = "MIT"

[dependencies]
ratio-manager = { path = ".." }
anyhow = "1"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zstd = "0.13"
