# Builds the OCI image with Nix and publishes it to GHCR as
# ghcr.io/idanreed/ratio-manager:<Cargo version>. Run on a version tag
# (`git tag v0.1.0 && git push --tags`) or by hand. The fleet pins the tag in
# stacks/ratio/compose.yaml and its digest in tests/lib/images.nix.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Test
        run: nix develop -c cargo test --release
      - name: Build
        run: nix build .#image -L
      - name: Push
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(nix eval --raw --impure --expr '(builtins.fromTOML (builtins.readFile ./Cargo.toml)).package.version')
          nix run nixpkgs#skopeo -- copy --dest-creds "$GH_ACTOR:$GH_TOKEN" \
            docker-archive:result "docker://ghcr.io/idanreed/ratio-manager:$version"
          echo "pushed ghcr.io/idanreed/ratio-manager:$version"
