[package]
name = "ratio-manager"
version = "0.1.1"
edition = "2021"
description = "TorrentLeech ratio building across home and rented seedboxes: sensors, an event bus, a baseline policy, a guard, drivers, an event log and a dashboard"
license = "MIT"

[dependencies]
anyhow = "1"
arrow = { version = "54", default-features = false }
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
percent-encoding = "2"
quick-xml = "0.37"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
